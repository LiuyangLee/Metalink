name: metalink-main-0.3
channels:
  - conda-forge
  - bioconda
dependencies:
  # python and packages used by the
  - python =3.12.13
  - biopython =1.85

  # Helper Python libraries used by scripts under metalink/scripts/
  - pandas =2.2.3
  - numpy =2.2.4
  - matplotlib =3.10.6
  - seaborn =0.13.2
  - openpyxl =3.1.5

  # Read-mode bioinformatics tools
  - kraken2 =2.1.3
  - bracken =3.0
  - frag_gene_scan_rs =1.1.0
  - prodigal =2.6.3

  # Assembly, trimming, mapping, and coverage
  - fastp =0.23.4
  - fastplong =0.5.0
  - megahit =1.2.9
  - spades =4.3.0
  - flye =2.9.6
  - samtools =1.21
  - bwa =0.7.18
  - bwa-mem2 =2.2.1
  - minibwa =0.4
  - strobealign =0.14.0
  - coverm =0.7.0
  - metabat2 =2.12.1

  # R 4.3 and packages used by the .cmd.R scripts for taxonomy/function
  # aggregation, visualization and module completeness (read mode and beyond)
  - r-base =4.3.3
  - r-data.table =1.15.4
  - r-optparse =1.7.5
  - r-tidyverse =2.0.0
  - r-ggplot2 =3.5.1
  - r-dplyr =1.1.4
  - r-ggrepel =0.9.6
  - r-htmlwidgets =1.6.4
  - r-reshape2 =1.4.4
  - r-devtools =2.4.5
  - r-pheatmap =1.0.13
  - r-plotly =4.10.4
  - r-r.utils =2.13.0
# - r-mclink =1.3.1

  # Shared utilities
  - seqkit =2.8.2
  - pigz =2.8
  - aria2
