Params_b_sample:
  00_raw_stats:
    threads: 4
  01_trim:
    threads: 16
    length_required: 15
    n_base_limit: 5
    compression: 4
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra fastp or fastplong raw reads trimming
  01_trim_stats:
    threads: 16
  02_assembly:
    threads: 40
    method: "megahit"
    # method: "spades"
    # method: "metaflye"
  02_megahit:
    presets: meta-sensitive        # meta-sensitive / meta-large
    # min_count: 2                # DIY k-mer
    # k_min: 21
    # k_max: 141
    # k_step: 12
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra MEGAHIT assembly
  02_spades:
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra SPAdes assembly, e.g., --rna for RNA-Seq data
  02_metaflye:
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra Flye assembly
  03_mapping:
    threads: 20
    method: "minibwa"
    # method: "bwamem2"
    # method: "bwamem"
    # method: "strobealign"
    samtools_sort_mem: 768M
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra mapping aligner
  07_contigs_depth:
    threads: 8
    min_read_percent_identity: 95
    contig_end_exclusion: 75
    min_contig_length: 300
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra prodigal for contigs

Params_b_project:
  01_cat_raw_stats:
    threads: 4
  02_cat_trimmed_stats:
    threads: 4
  03_contigs_stats:
    threads: 4
  04_merge_reads_contigs_stats:
    threads: 4

Params_v_sample:
  01_virus_identify:
    identify_method: "genomad_vs_vb"
    virus_length_limit: 2000
    threads: 8
  03_taxonomy_CAT_pack:
    range: 10
    fraction: 0.50
    threads: 8
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra CAT_pack contigs viral
  03_mapping:
    threads: 20
    method: "minibwa"
    # method: "bwamem2"
    # method: "bwamem"
    # method: "strobealign"
    samtools_sort_mem: 768M
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra mapping aligner
  04_binning:
    threads: 8
  05_checkv:
    threads: 8
  06_vclust:
    ani: 0.95
    threads: 8
    prefilter_extra_args: ""
    # prefilter_extra_args: "--custom-flag"   # user-supplied extra vclust prefilter
    align_extra_args: ""
    # align_extra_args: "--custom-flag"   # user-supplied extra vclust align
    cluster_extra_args: ""
    # cluster_extra_args: "--custom-flag"   # user-supplied extra vclust cluster
  07_iPHoP:
    threads: 20
  08_taxonomy_BAT:
    range: 10
    fraction: 0.50
    threads: 8
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra CAT_pack bins viral
  09_coverm_eachsample_vMAGs:
    method: "trimmed_mean"
    min_read_percent_identity: 95
    min_read_aligned_length: 45
    contig_end_exclusion: 75
    threads: 8
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra coverm genome sample-level viral

Params_v_project:
  06_vclust:
    ani: 0.95
    threads: 8
    prefilter_extra_args: ""
    # prefilter_extra_args: "--custom-flag"   # user-supplied extra vclust prefilter
    align_extra_args: ""
    # align_extra_args: "--custom-flag"   # user-supplied extra vclust align
    cluster_extra_args: ""
    # cluster_extra_args: "--custom-flag"   # user-supplied extra vclust cluster
  07_iPHoP:
    custom_MAGs_dir: "none"
    #custom_MAGs_dir: /path/to/MAGs/
    threads: 60

Params_pmr_v_sample:
  03_mapping:
    method: "minibwa"
    # method: "bwamem2"
    # method: "bwamem"
    # method: "strobealign"
    samtools_sort_mem: 768M
    threads: 20
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra mapping aligner
  03_coverm_MAGs:
    method: "trimmed_mean"
    min_read_percent_identity: 95
    min_read_aligned_length: 45
    contig_end_exclusion: 75
    threads: 8
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra coverm genome project-level viral
  03_coverm_contigs:
    method: "trimmed_mean"
    min_read_percent_identity: 95
    min_read_aligned_length: 45
    contig_end_exclusion: 75
    threads: 20
    extra_args: ""
    # extra_args: "--custom-flag"   # user-supplied extra coverm contig project-level viral
  05_merge_tax_fun_depth:
    KO_mode: ignore_multiple_KOs
    #KO_mode: "keep_multiple_KOs", "split_multiple_KOs", "ignore_multiple_KOs"
    minORFLen: 50
    min_KO_num_in_one_taxon: 100
    CAMI_format_output: false
    output_detail: false
    threads: 20
  06_mclink_taxon:
    min_KO_num_in_one_taxon: 100
    min_mean_KO_RA_in_one_taxon: 0
    completeness_threshold: 0.5 # 0-1
    plus_scale_method: "mean" # 'mean', 'max', or 'min'
    comma_scale_method: "sum" # e.g., 'max' for presence/absence data, or 'sum' for abundance data"
    TopN: 100

Params_pmr_v_project:
  02_quality_gate:
    checkv_quality: "Not-determined" #"Complete, High-quality, Medium-quality, Low-quality, Not-determined (default: Not-determined, i.e. keep all)"
  01_Taxa_visualize:
    TopN: 10
  03_Fun_visualize:
    TopN: 10
  03_mclink_sample:
    min_sample_num_per_KO: 1
    preva: 0
    abund: 0
    completeness_threshold: 0.5 # 0-1
    plus_scale_method: "mean" # 'mean', 'max', or 'min'
    comma_scale_method: "sum" # e.g., 'max' for presence/absence data, or 'sum' for abundance data"
  05_merge_tax_KO_depth:
    preva: 0.10
    abund: 0.0 # TPM/GPM sum of a sample is 1e6
  05_merge_tax_Module_RelativeAbundance:
    preva: 0.10
    abund: 0.0 # TPM/GPM sum of a sample is 1e6
  05_merge_tax_Module_SumCoverage:
    preva: 0.10
    abund: 0.0 # TPM/GPM sum of a sample is 1e6
  06_mclink_taxon:
    min_KO_num_in_one_taxon: 100
    min_mean_KO_RA_in_one_taxon: 0
    completeness_threshold: 0.5 # 0-1
    plus_scale_method: "mean" # 'mean', 'max', or 'min'
    comma_scale_method: "sum" # e.g., 'max' for presence/absence data, or 'sum' for abundance data"
    TopN: 100
